<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auth Chat Demo</title>

  <script>
    /**
     * ==========================================================
     *  AUTH CONFIG — UPDATE THESE
     * ==========================================================
     * - authorizationEndpoint: your IdP /authorize endpoint
     * - clientId: your IdP OIDC app client id
     * - redirectUri: MUST be registered in your IdP AND match what Genesys expects
     * - scope: usually "openid profile email"
     */
    const AUTH_CONFIG = {
      authorizationEndpoint: "https://login.microsoftonline.com/YOUR_TENANT_ID/oauth2/v2.0/authorize",
      clientId: "YOUR_CLIENT_ID",
      redirectUri: "https://example.com/callback",
      scope: "openid profile email offline_access",
      // Optional: if you need a forced login each time
      // prompt: "login",
    };
    const CALLBACK_ORIGIN = new URL(AUTH_CONFIG.redirectUri).origin;

    /**
     * ==========================================================
     *  PKCE HELPERS
     * ==========================================================
     */
    function base64UrlEncode(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      let str = "";
      for (const b of bytes) str += String.fromCharCode(b);
      return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function randomString(bytes = 32) {
      const arr = new Uint8Array(bytes);
      crypto.getRandomValues(arr);
      return base64UrlEncode(arr);
    }

    async function sha256(str) {
      const data = new TextEncoder().encode(str);
      return crypto.subtle.digest("SHA-256", data);
    }

    async function pkceChallengeFromVerifier(verifier) {
      const hashed = await sha256(verifier);
      return base64UrlEncode(hashed);
    }

    /**
     * ==========================================================
     *  START LOGIN (POPUP) AND RETURN { authCode, redirectUri, codeVerifier, nonce }
     * ==========================================================
     */
    async function getAuthCodeViaPopup() {
      const codeVerifier = randomString(48);
      const codeChallenge = await pkceChallengeFromVerifier(codeVerifier);

      const state = randomString(24);
      const nonce = crypto.randomUUID();

      sessionStorage.setItem("gc_pkce_verifier", codeVerifier);
      sessionStorage.setItem("gc_oidc_state", state);
      sessionStorage.setItem("gc_oidc_nonce", nonce);

      const url = new URL(AUTH_CONFIG.authorizationEndpoint);
      url.searchParams.set("client_id", AUTH_CONFIG.clientId);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", AUTH_CONFIG.scope);
      url.searchParams.set("redirect_uri", AUTH_CONFIG.redirectUri);
      url.searchParams.set("state", state);
      url.searchParams.set("nonce", nonce);

      // PKCE
      url.searchParams.set("code_challenge", codeChallenge);
      url.searchParams.set("code_challenge_method", "S256");

      // Optional prompt
      if (AUTH_CONFIG.prompt) url.searchParams.set("prompt", AUTH_CONFIG.prompt);

      const w = 600, h = 750;
      const left = Math.max(0, (window.screen.width - w) / 2);
      const top = Math.max(0, (window.screen.height - h) / 2);

      const popup = window.open(
        url.toString(),
        "gc_oidc_login",
        `width=${w},height=${h},left=${left},top=${top}`
      );

      if (!popup) throw new Error("Popup blocked (allow popups for this site).");

      const result = await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Login timed out."));
        }, 2 * 60 * 1000);

        function onMessage(event) {
          if (event.origin !== CALLBACK_ORIGIN) return;
          if (event.source !== popup) return;

          if (!event.data || event.data.type !== "GC_OIDC_CODE") return;
          cleanup();
          resolve(event.data.payload);
        }

        function cleanup() {
          clearTimeout(timeout);
          window.removeEventListener("message", onMessage);
          try { popup.close(); } catch {}
        }

        window.addEventListener("message", onMessage);
      });

      if (result.error) {
        throw new Error(result.errorDescription || result.error || "Login failed.");
      }

      const expectedState = sessionStorage.getItem("gc_oidc_state");
      if (result.state !== expectedState) {
        throw new Error("Invalid state returned from IdP (possible CSRF).");
      }

      return {
        authCode: result.code,
        redirectUri: AUTH_CONFIG.redirectUri,
        codeVerifier: sessionStorage.getItem("gc_pkce_verifier"),
        nonce: sessionStorage.getItem("gc_oidc_nonce"),
      };
    }

    /**
     * ==========================================================
     *  HANDLE SILENT REFRESH FLOW
     * ==========================================================
     */
    async function getAuthCodeSilently() {
      const codeVerifier = randomString(48);
      const codeChallenge = await pkceChallengeFromVerifier(codeVerifier);

      const state = randomString(24);
      const nonce = crypto.randomUUID();

      sessionStorage.setItem("gc_pkce_verifier", codeVerifier);
      sessionStorage.setItem("gc_oidc_state", state);
      sessionStorage.setItem("gc_oidc_nonce", nonce);

      const url = new URL(AUTH_CONFIG.authorizationEndpoint);
      url.searchParams.set("client_id", AUTH_CONFIG.clientId);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", AUTH_CONFIG.scope);
      url.searchParams.set("redirect_uri", AUTH_CONFIG.redirectUri);
      url.searchParams.set("state", state);
      url.searchParams.set("nonce", nonce);

      // PKCE
      url.searchParams.set("code_challenge", codeChallenge);
      url.searchParams.set("code_challenge_method", "S256");

      // Silent authentication parameters
      url.searchParams.set("prompt", "none");
      url.searchParams.set("response_mode", "query"); // Or 'fragment' depending on IdP

      return new Promise((resolve, reject) => {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = url.toString();

        function cleanup() {
          clearTimeout(timeout);
          window.removeEventListener("message", onMessage);
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Silent refresh timed out."));
        }, 10 * 1000); // 10 seconds timeout for silent refresh

        function onMessage(event) {
          if (event.origin !== CALLBACK_ORIGIN) return;
          if (event.source !== iframe.contentWindow) return;

          if (event.data && event.data.type === "GC_OIDC_CODE") {
            cleanup();

            const result = event.data.payload;
            const expectedState = sessionStorage.getItem("gc_oidc_state");

            if (result.error) {
              return reject(new Error(result.errorDescription || result.error || "Silent login failed."));
            }

            if (result.state !== expectedState) {
              return reject(new Error("Invalid state returned from IdP (possible CSRF) during silent refresh."));
            }

            resolve({
              authCode: result.code,
              redirectUri: AUTH_CONFIG.redirectUri,
              codeVerifier: sessionStorage.getItem("gc_pkce_verifier"),
              nonce: sessionStorage.getItem("gc_oidc_nonce"),
            });
          }
        }

        window.addEventListener("message", onMessage);

        document.body.appendChild(iframe);
      });
    }

    /**
     * ==========================================================
     *  HANDLE REFRESH TOKEN FLOW (Genesys specific)
     * ==========================================================
     */
    async function refreshTokenFlow(refreshToken) {
      // Genesys Cloud API endpoint for refreshing tokens
      // The environment is "prod-euw1", so the API base URL is api.mypurecloud.ie
      const tokenRefreshEndpoint = "https://api.mypurecloud.ie/api/v2/webdeployments/token/refresh";

      const response = await fetch(tokenRefreshEndpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ refreshToken: refreshToken }),
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({ message: response.statusText }));
        throw new Error(`Genesys token refresh failed: ${error.message}`);
      }

      const tokenData = await response.json();
      // The Genesys API returns a 'jwt' field, not a full OIDC token response.
      // The Messenger SDK expects this 'jwt' to be returned.
      return { jwt: tokenData.jwt };
    }

    /**
     * ==========================================================
     *  GENESYS BOOTSTRAP
     * ==========================================================
     */
    (function (g, e, n, es, ys) {
      g["_genesysJs"] = e;
      g[e] = g[e] || function () { (g[e].q = g[e].q || []).push(arguments); };
      g[e].t = 1 * new Date();
      g[e].c = es;
      ys = document.createElement("script"); ys.async = 1; ys.src = n; ys.charset = "utf-8";
      document.head.appendChild(ys);
    })(window, "Genesys", "https://apps.mypurecloud.ie/genesys-bootstrap/genesys.min.js", {
      environment: "prod-euw1",
      deploymentId: "891826ea-822e-45fe-a0a5-0074820d7851"
    });

    /**
     * ==========================================================
     *  AUTH PROVIDER PLUGIN
     * ==========================================================
     * Note: Calls queue safely even before genesys.min.js finishes loading.
     */
    Genesys("registerPlugin", "AuthProvider", (AuthProvider) => {
      console.log("AuthProvider plugin registration started.");

      // Mandatory: Messenger asks for a code here
      AuthProvider.registerCommand("getAuthCode", async (e) => {
        try {
          const data = await getAuthCodeViaPopup();
          e.resolve({
            authCode: data.authCode,
            redirectUri: data.redirectUri,
            codeVerifier: data.codeVerifier, // REQUIRED when PKCE enabled
            nonce: data.nonce,               // OKTA: applicable
            // maxAge: 0,                     // OKTA: optional if you use it
            // iss: "..."                     // optional if your IdP returns it
          });
        } catch (err) {
          console.error("getAuthCode failed:", err);
          e.reject(err);
        }
      });
      console.log("Registered 'getAuthCode' command.");

      // Called when refresh/auth context is no longer valid
      AuthProvider.registerCommand("reAuthenticate", async (e) => {
        console.log(">>> reAuthenticate command CALLED by Messenger.");
        try {
          // First, try silent refresh
          const data = await getAuthCodeSilently();
          console.log("Silent re-authentication successful.");
          e.resolve({
            authCode: data.authCode,
            redirectUri: data.redirectUri,
            codeVerifier: data.codeVerifier,
            nonce: data.nonce,
          });
        } catch (silentErr) {
          console.warn("Silent re-authentication failed, falling back to popup:", silentErr);
          try {
            // If silent fails, fall back to popup login
            const data = await getAuthCodeViaPopup();
            console.log("Popup re-authentication successful.");
            e.resolve({
              authCode: data.authCode,
              redirectUri: data.redirectUri,
              codeVerifier: data.codeVerifier,
              nonce: data.nonce,
            });
          } catch (popupErr) {
            console.error("!!! reAuthenticate command FAILED after silent and popup attempts.", popupErr);
            e.reject(popupErr);
          }
        }
      });
      console.log("Registered 'reAuthenticate' command.");

      // Optional: used with Step-up auth scenarios
      AuthProvider.registerCommand("signIn", async (e) => {
        try {
          const data = await getAuthCodeViaPopup();
          AuthProvider.publish("signedIn", data);
          e.resolve(data);
        } catch (err) {
          AuthProvider.publish("signInFailed", err);
          e.reject(err);
        }
      });
      console.log("Registered 'signIn' command.");

      AuthProvider.subscribe("Auth.loggedOut", () => {
        console.log("Auth.loggedOut event received.");
        sessionStorage.removeItem("gc_pkce_verifier");
        sessionStorage.removeItem("gc_oidc_state");
        sessionStorage.removeItem("gc_oidc_nonce");
      });
      console.log("Subscribed to 'Auth.loggedOut' event.");

      AuthProvider.subscribe("Auth.authError", (error) => {
        console.warn("!!! Messenger Auth.authError event received:", error);
      });
      console.log("Subscribed to 'Auth.authError' event.");

      AuthProvider.ready();
      console.log("AuthProvider plugin is ready.");
    });
  </script>
</head>

<body>
  <h2>Scientific AI Application Support</h2>
</body>
</html>
