<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genesys Cloud Analytics Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="layout pkce-layout">
    <header class="hero panel">
      <p class="eyebrow">Genesys Cloud Analytics</p>
      <h1>Genesys Analytics Portal</h1>
      <p class="subtitle">Run analytics cost allocation pipelines with tenant config stored in Genesys Cloud.</p>
      <p id="authenticated-user" class="user-line"></p>
      <div class="section-head hero-head">
        <p id="auth-status" class="status"></p>
        <button id="sign-out-button" type="button" class="link-button">Re-authenticate</button>
      </div>
      <p id="build-version" class="small"></p>
    </header>

    <section class="panel">
      <h2>Run Pipeline</h2>
      <form id="pipeline-form" class="form-row">
        <label>
          <span>Pipeline</span>
          <select id="pipeline-name">
            <option value="botflowCost">botflowCost</option>
            <option value="smsCost">smsCost</option>
          </select>
        </label>

        <label>
          <span>Time Frame</span>
          <div class="interval-group">
            <select id="pipeline-interval-preset">
              <option value="today">Today</option>
              <option value="yesterday" selected>Yesterday</option>
              <option value="thisweek">This Week</option>
              <option value="lastweek">Last Week</option>
              <option value="thismonth">This Month</option>
              <option value="lastmonth">Last Month</option>
              <option value="month">Specific Month</option>
              <option value="custom">Custom</option>
            </select>
            <div id="pipeline-month-range" class="month-range hidden">
              <input id="pipeline-month" type="month" />
            </div>
            <div id="pipeline-custom-range" class="custom-range hidden">
              <input id="pipeline-start-date" type="date" />
              <input id="pipeline-end-date" type="date" />
            </div>
          </div>
        </label>

        <div class="pkce-actions">
          <button type="submit">Run Pipeline</button>
        </div>
      </form>
      <p id="pipeline-status" class="status"></p>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Last Runs</h2>
      </div>
      <p id="runs-status" class="status"></p>
      <div class="table-wrap runs-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pipeline</th>
              <th>Status</th>
              <th>Interval</th>
              <th>Started</th>
              <th>Duration</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="section-head report-head">
        <h2>Report</h2>
        <div class="pkce-actions report-actions">
          <p id="report-meta" class="small report-meta"></p>
          <button id="download-report-button" type="button" class="secondary">Download Report</button>
        </div>
      </div>
      <div id="report-structured" class="report-structured"></div>
      <details id="raw-report-details" class="raw-report-details">
        <summary>Raw Report</summary>
        <pre id="report-output" class="report">Run a pipeline or select a run to view its report.</pre>
      </details>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
