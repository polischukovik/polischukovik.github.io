<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Genesys Cloud Authenticated Messaging</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #1a73e8;
        }
        p {
            font-size: 1.1em;
        }
        footer {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            font-size: 0.8em;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>Genesys Cloud Authenticated Web Messaging</h1>
    <p>The messenger widget should open automatically once loaded.</p>

    <!-- Genesys Cloud Messenger Snippet -->
    <script type="text/javascript" charset="utf-8">
      (function (g, e, n, es, ys) {
        g['_genesysJs'] = e;
        g[e] = g[e] || function () {
          (g[e].q = g[e].q || []).push(arguments)
        };
        g[e].t = 1 * new Date();
        g[e].c = es;
        ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
      })(window, 'Genesys', 'https://apps.mypurecloud.ie/genesys-bootstrap/genesys.min.js', {
        environment: 'prod-euw1',
        deploymentId: '491c0994-1eaf-4015-93bf-d64012aa91a3'
      });
    </script>

    <!-- Script to automatically open the messenger -->
    <script>
        Genesys('subscribe', 'Messenger.ready', function(){
            console.log('Messenger is ready, opening it.');
            Genesys('command', 'Messenger.open');
        });
    </script>

    <footer>
        <p>Last deployed: 2026-01-09 19:16:43 CET</p>
    </footer>

</body>
</html>
